<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SkyCast — a modern weather forecast. Current conditions, hourly and 7-day forecasts for any city on Earth." />
    <title>SkyCast — Weather Forecast</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='21' cy='11' r='7' fill='%23ffb95e'/%3E%3Cpath d='M8 27h14.5a6 6 0 0 0 1.2-11.9A9 9 0 0 0 6.9 17.6 5.4 5.4 0 0 0 8 27z' fill='%2335bcd8'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem("skycast:theme");
          var theme = raw ? JSON.parse(raw) : null;
          var dark = theme
            ? theme === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
